name: Verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  postgres-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dreamteam
          POSTGRES_USER: dreamteam
          POSTGRES_PASSWORD: local-testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dreamteam -d dreamteam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DREAMTEAM_DATABASE_URL: postgresql://dreamteam:local-testing@127.0.0.1:5432/dreamteam
      DREAMTEAM_TEST_DATABASE_URL: postgresql://dreamteam:local-testing@127.0.0.1:5432/dreamteam
      DREAMTEAM_BOT_USERNAME: dreamteam_test_bot
      DREAMTEAM_BOT_TOKEN: ci-only-test-value
      DREAMTEAM_E2E_BOT_TOKEN: ci-only-test-value
      DREAMTEAM_INSECURE_LOCAL_COOKIE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies and run API tests
        working-directory: backend
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest -q
      - name: Build frontend and install Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Verify the two-player flow
        shell: bash
        run: |
          (
            cd backend
            python -m dreamteam.migrate
            exec python -m uvicorn dreamteam.api:create_app --factory --host 127.0.0.1 --port 8000
          ) > "$RUNNER_TEMP/dreamteam-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          if ! timeout 30 bash -c 'until curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; do sleep 0.5; done'; then
            cat "$RUNNER_TEMP/dreamteam-api.log"
            exit 1
          fi
          npm --prefix frontend test
